[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "revecodiego22-cell", email = "revecodiego22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "incidents-analysis",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = true

[tool.uv.sources]
incidents-analysis = { path = "../../packages/incidents-analysis", editable = true }

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["models", "database", "seed", "main"]
packages = ["routes"]
